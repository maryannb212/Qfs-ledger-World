<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Qfs ledger World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <a href="index.html" class="login-logo">
          <svg viewBox="0 0 32 32" width="32" height="32">
            <circle cx="16" cy="16" r="14" fill="#3DD598" stroke="#1a1a2e" stroke-width="2" />
            <text x="16" y="21" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">Q</text>
          </svg>
        </a>
        <h1 class="login-title">Reset Password</h1>
        <p style="margin-top: 10px; font-size: 0.9rem; color: #64748b;">Enter your username or email and your new password to reset it.</p>
      </div>
      
      <form class="login-form" id="forgotPasswordForm" action="#" method="POST">
        <div id="form-message" style="margin-bottom: 15px; font-size: 0.9rem; text-align: center;"></div>
        
        <div class="form-group">
          <input type="text" class="form-control" id="reset-username" placeholder="Enter Username or Email" required>
        </div>
        
        <div class="form-group">
          <input type="password" class="form-control" id="reset-new-password" placeholder="Enter New Password" required>
        </div>
        
        <button type="submit" class="btn btn--primary btn--full" style="margin-top: 10px;">Reset Password</button>
      </form>
      
      <div class="login-footer">
        <p>Remembered your password? <a href="login.html">Login here</a></p>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('reset-username').value;
      const newPassword = document.getElementById('reset-new-password').value;
      const msgDiv = document.getElementById('form-message');
      
      try {
        const response = await fetch('/api/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, newPassword })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          msgDiv.style.color = '#22c55e';
          msgDiv.textContent = data.message + ' Redirecting to login...';
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 2000);
        } else {
          msgDiv.style.color = '#ef4444';
          msgDiv.textContent = data.error || 'An error occurred';
        }
      } catch (err) {
        msgDiv.style.color = '#ef4444';
        msgDiv.textContent = 'Server connection error';
      }
    });
  </script>

</body>
</html>
