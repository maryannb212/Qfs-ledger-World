<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - Qfs ledger World</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/dashboard.css">
  <link rel="stylesheet" href="/chat.css">
  <style>
    .profile-card {
      background: white;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      max-width: 800px;
      margin: 0 auto;
    }
    .profile-header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid #eee;
    }
    .profile-avatar {
      width: 80px;
      height: 80px;
      background: #3DD598;
      color: #1a1a2e;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      font-weight: 700;
    }
    .profile-info h2 {
      margin: 0;
      font-size: 1.5rem;
    }
    .profile-info p {
      margin: 5px 0 0;
      color: #666;
    }
    .section-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin: 30px 0 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-title i {
      color: #3DD598;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: #444;
    }
    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus {
      border-color: #3DD598;
    }
    .wallet-note {
      background: #fff8e1;
      border-left: 4px solid #ffc107;
      padding: 15px;
      border-radius: 4px;
      margin-bottom: 25px;
      font-size: 0.9rem;
      color: #856404;
    }
    .save-btn {
      background: #1a1a2e;
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-top: 20px;
      transition: background 0.2s;
    }
    .save-btn:hover {
      background: #3DD598;
      color: #1a1a2e;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 600px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = 'login.html';
  </script>

  <!-- Header / Navigation -->
  <header class="dash-header">
    <div class="header-left">
      <a href="dashboard.html" class="dashboard-logo-link">
        <svg viewBox="0 0 32 32" width="28" height="28">
          <circle cx="16" cy="16" r="14" fill="#3DD598" stroke="#1a1a2e" stroke-width="2" />
          <text x="16" y="21" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">Q</text>
        </svg>
      </a>
      <div style="font-weight: 600; font-size: 0.85rem; color: #666; margin-left: 10px;">User Profile</div>
    </div>
    <nav class="header-nav">
      <a href="dashboard.html" class="nav-link"><i class="fa-solid fa-border-all"></i> Dashboard</a>
      <a href="#" class="nav-link active"><i class="fa-solid fa-gear"></i> Settings</a>
      <a href="#" class="nav-link" id="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
    </nav>
  </header>

  <main class="dashboard-container" style="padding-top: 100px; padding-bottom: 50px;">
    <div class="profile-card">
      <div class="profile-header">
        <div class="profile-avatar" id="avatar-init">U</div>
        <div class="profile-info">
          <h2 id="header-username">Username</h2>
          <p id="header-email">email@example.com</p>
          <p style="font-size: 0.8rem; color: #999;">Registered on: <span id="reg-date">N/A</span></p>
        </div>
      </div>

      <div class="wallet-note">
        <i class="fa-solid fa-triangle-exclamation"></i>
        Please save your wallet address to receive withdrawals!
      </div>

      <form id="profile-form">
        <div class="section-title"><i class="fa-solid fa-user"></i> Personal Information</div>
        <div class="grid-2">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="firstname" placeholder="Enter full name">
          </div>
          <div class="form-group">
            <label>E-mail Address</label>
            <input type="email" id="email" placeholder="Enter email">
          </div>
        </div>

        <div class="section-title"><i class="fa-solid fa-wallet"></i> Wallet Addresses</div>
        <div class="form-group">
          <label>Your XRP RIPPLE Address</label>
          <input type="text" id="xrp_address" placeholder="Enter XRP address">
        </div>
        <div class="form-group">
          <label>Your XLM Address</label>
          <input type="text" id="xlm_address" placeholder="Enter XLM address">
        </div>
        <div class="form-group">
          <label>Your ALGO Address</label>
          <input type="text" id="algo_address" placeholder="Enter ALGO address">
        </div>

        <div class="section-title"><i class="fa-solid fa-lock"></i> Security</div>
        <div class="grid-2">
          <div class="form-group">
            <label>New Password</label>
            <input type="password" id="newPassword" placeholder="Leave blank to keep current">
          </div>
          <div class="form-group">
            <label>Retype Password</label>
            <input type="password" id="rePassword" placeholder="Confirm new password">
          </div>
        </div>

        <button type="submit" class="save-btn">Save for settings</button>
      </form>
    </div>
  </main>

  <!-- Custom Chatbot Window -->
  <div class="chat-window" id="chat-window" style="display: none;">
    <div class="chat-window__header">
      <div class="chat-window__header-info">
        <div class="chat-window__avatar">Q</div>
        <div>
          <h4>Support</h4>
          <span class="chat-window__status">Online</span>
        </div>
      </div>
      <button class="chat-window__close" id="chat-close">&times;</button>
    </div>
    <div class="chat-window__body" id="chat-body">
      <div class="chat-message bot">
        <div class="chat-bubble">Hello! How can we help you today?</div>
      </div>
    </div>
    <div class="chat-window__footer">
      <input type="text" id="chat-input" placeholder="Type a message..." autocomplete="off" />
      <button id="chat-send"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
  </div>

  <script src="/chat.js"></script>
  <script>
    // Fetch and populate profile data
    async function loadProfile() {
      try {
        const response = await fetch('/api/profile', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await response.json();

        if (response.ok) {
          document.getElementById('header-username').textContent = data.username;
          document.getElementById('header-email').textContent = data.email;
          document.getElementById('avatar-init').textContent = data.username.charAt(0).toUpperCase();
          document.getElementById('firstname').value = data.firstname || '';
          document.getElementById('email').value = data.email || '';
          document.getElementById('xrp_address').value = data.xrp_address || '';
          document.getElementById('xlm_address').value = data.xlm_address || '';
          document.getElementById('algo_address').value = data.algo_address || '';
          
          if (data.created_at) {
            const date = new Date(data.created_at);
            document.getElementById('reg-date').textContent = date.toLocaleString();
          }
        }
      } catch (err) {
        console.error('Error loading profile:', err);
      }
    }

    loadProfile();

    // Handle form submission
    document.getElementById('profile-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const newPassword = document.getElementById('newPassword').value;
      const rePassword = document.getElementById('rePassword').value;

      if (newPassword && newPassword !== rePassword) {
        alert('Passwords do not match');
        return;
      }

      const updates = {
        firstname: document.getElementById('firstname').value,
        email: document.getElementById('email').value,
        xrp_address: document.getElementById('xrp_address').value,
        xlm_address: document.getElementById('xlm_address').value,
        algo_address: document.getElementById('algo_address').value
      };

      if (newPassword) updates.newPassword = newPassword;

      try {
        const response = await fetch('/api/profile', {
          method: 'POST',
          headers: { 
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(updates)
        });

        const result = await response.json();
        if (response.ok) {
          alert('Profile updated successfully!');
          // Update local storage if email/firstname changed
          const user = JSON.parse(localStorage.getItem('user'));
          user.firstname = updates.firstname;
          localStorage.setItem('user', JSON.stringify(user));
          loadProfile();
        } else {
          alert(result.error || 'Update failed');
        }
      } catch (err) {
        alert('Error connecting to server');
      }
    });

    // Handle logout
    document.getElementById('logout-btn').addEventListener('click', (e) => {
      e.preventDefault();
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = 'login.html';
    });
  </script>
</body>
</html>
